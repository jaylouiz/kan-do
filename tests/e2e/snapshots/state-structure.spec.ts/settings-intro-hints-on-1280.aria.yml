- region "Kurz erklärt":
  - heading "Kurz erklärt" [level=2]
  - paragraph: Hinweise zum Einstieg
  - paragraph: Kurze Hinweise auf dem Board zeigen dir den nächsten Schritt.
  - button "Ausschalten"
  - list:
    - listitem:
      - heading "Grundlegendes" [level=3]
      - paragraph: Willkommen bei deinem Kanban-Board
      - paragraph: Unter „Offen“ sammelst du alles, was du heute erledigen möchtest. Sammle dort, was heute ansteht. In „Jetzt“ schiebst du eine Aufgabe, sobald du an ihr arbeitest.
    - listitem:
      - heading "Anfangen" [level=3]
      - paragraph: Womit fängst du an?
      - paragraph: Ziehe in „Jetzt“, woran du gerade arbeitest. Diese Spalte hat immer nur Platz für eine Aufgabe. Für schnelle Wechsel kannst du eine andere Aufgabe einfach darüber ablegen.
    - listitem:
      - heading "An einer Aufgabe dranbleiben" [level=3]
      - paragraph: Die Zeit läuft mit und wenn du dir eine Timebox gegeben hast, siehst du wieviel Zeit davon noch übrig ist.
      - paragraph: Ziehe die Karte in „Erledigt“, sobald die Aufgabe erledigt ist. Wartest du auf jemanden, ziehe sie in „Wartet“.
    - listitem:
      - heading "Den Überblick behalten" [level=3]
      - paragraph: Viel zu tun?
      - paragraph: Gestapelt nach Thema oder Priorität wählst du leichter aus. Die Stapel findest du auch unter „Mehr“.
    - listitem:
      - heading "Tag abschließen" [level=3]
      - paragraph: Fertig für heute?
      - paragraph: Wähle„Tag abschließen“ und sieh dir eine kleine Tagesauswertung an.
    - listitem:
      - heading "Die Aufgaben des Tages planen" [level=3]
      - paragraph: Wähle aus, was heute dran ist
      - paragraph: Schiebe sie in die heutige Auswahl oder drücke den Pfeil-Button. Sobald du loslegen willst, wechsle in der Navigation zu „Heute“.
