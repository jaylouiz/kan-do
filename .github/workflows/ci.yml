name: CI

# Third-party actions are pinned by commit SHA (version in the comment); bump them deliberately.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.claude/**']
  # PRs run with the read-only token below and no secrets. Standard runners are free for this public repo.
  # A PR runs `quality` only (owner decision 2026-11-12, alpha phase: fast merges); `plan` and `e2e` run on a push to `main`
  # and by hand. The pre-merge gate on the developer's machine is the E2E check of a PR.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', '.claude/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npx vitest run
      # The live copy editor (#59) is dev-only: a build without KANDO_COPY_EDITOR must contain none of it.
      - run: npm run generate
      - run: npx vitest run tests/config/copy-editor-build-output.test.ts
        env:
          COPY_EDITOR_REQUIRE_BUILD: '1'
      # `/ui` and `/error-test` (#65) are dev-only too: the generated build must have neither route nor catalog string.
      - run: npx vitest run tests/config/ui-catalog-build-output.test.ts
        env:
          UI_CATALOG_REQUIRE_BUILD: '1'
      # Advisory design anti-pattern scan (regex mode on .vue); findings never fail the job.
      - name: Impeccable detector (advisory)
        run: |
          set +e
          npx impeccable detect --json components pages layouts assets app.vue > impeccable-report.json
          code=$?
          set -e
          case "$code" in
            0) echo "Impeccable detector: no findings" ;;
            2) echo "::warning::Impeccable detector reported findings (advisory)" ;;
            *) echo "::error::Impeccable detector failed (exit $code)"; exit "$code" ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: impeccable-report
          path: impeccable-report.json
          retention-days: 7

  # What the `e2e` matrix runs (kd#187). A pull request runs the selection of the pre-merge gate (`scripts/e2e-gate.mjs`:
  # smoke set + the specs mapped to its files), or the full suite when it changes what decides or runs the tests
  # (this workflow, the plan and gate scripts, the E2E server, the Playwright config, package files); a push to `main`
  # and a manual run run every spec. A file no `map` rule covers is caught by the full run on `main`. The plan needs
  # no dependencies, only Node and the PR's history for the merge base. `.claude/hooks/e2e-*` changes cannot be
  # covered here: `paths-ignore` keeps `.claude/**` out of CI.
  # Not on a pull request (see `on` above); `e2e` needs this job, so it is skipped with it. To run E2E per PR again, drop
  # this `if`: the plan script still selects the gate's specs for a pull request.
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      tier: ${{ steps.plan.outputs.tier }}
      specs: ${{ steps.plan.outputs.specs }}
      total: ${{ steps.plan.outputs.total }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: plan
        run: node scripts/ci-e2e-plan.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # The selected specs split over up to eight runners (#129: one 2-vCPU runner needed ~25 min for the ~1350 tests);
  # the shards together run every selected spec exactly once, and a tiered run uses as many shards as its spec count
  # needs (no shard may be empty). Starts beside `quality`, not after it. Runs in Playwright's image, so no browser and
  # no system package is installed during the job (kd#186); its tag must equal the locked `playwright` version
  # (`tests/config/deploy-triggers.test.ts`). `npm run release` runs the full suite again.
  e2e:
    name: e2e (${{ matrix.shard }}/${{ needs.plan.outputs.total }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # visual-regression.spec.ts self-skips when CI is set (baselines are macOS-rendered). SPECS is empty for the full suite.
      - run: npm run test:e2e -- $SPECS --shard=${{ matrix.shard }}/${{ needs.plan.outputs.total }}
        env:
          SPECS: ${{ needs.plan.outputs.specs }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: tests/e2e/playwright-report
          retention-days: 7
