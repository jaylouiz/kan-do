name: CI

# Third-party actions are pinned by commit SHA (version in the comment); bump them deliberately.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.claude/**']
  # PRs run with the read-only token below and no secrets. Standard runners are free for this public repo,
  # so both jobs always run in full; the local gate (pre-push hook, pre-merge E2E hook) follows the testing mode.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', '.claude/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npx vitest run
      # The live copy editor (#59) is dev-only: a build without KANDO_COPY_EDITOR must contain none of it.
      - run: npm run generate
      - run: npx vitest run tests/config/copy-editor-build-output.test.ts
        env:
          COPY_EDITOR_REQUIRE_BUILD: '1'
      # `/ui` and `/error-test` (#65) are dev-only too: the generated build must have neither route nor catalog string.
      - run: npx vitest run tests/config/ui-catalog-build-output.test.ts
        env:
          UI_CATALOG_REQUIRE_BUILD: '1'
      # Advisory design anti-pattern scan (regex mode on .vue); findings never fail the job.
      - name: Impeccable detector (advisory)
        run: |
          set +e
          npx impeccable detect --json components pages layouts assets app.vue > impeccable-report.json
          code=$?
          set -e
          case "$code" in
            0) echo "Impeccable detector: no findings" ;;
            2) echo "::warning::Impeccable detector reported findings (advisory)" ;;
            *) echo "::error::Impeccable detector failed (exit $code)"; exit "$code" ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: impeccable-report
          path: impeccable-report.json
          retention-days: 7

  # Full suite after `quality` on every run, split over four runners (#129): one 2-vCPU runner needed ~25 min for the
  # ~1350 tests and sat just under a 30 min cap. The shards together run every spec exactly once; the pre-merge hook
  # runs its tiered selection locally and `npm run release` the full suite again.
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      # System packages are best effort with a time limit (kd#186): the runner image already has Chromium's libraries, the
      # rest are fallback fonts. An unreachable Ubuntu mirror failed every shard before a test ran, or hung to the job
      # timeout. A library that is really missing still fails loudly when the browser starts.
      - name: Install Chromium system packages (best effort)
        run: |
          timeout --kill-after=10 180 npx playwright install-deps chromium \
            || echo "::warning::Playwright system packages were not installed (package mirror unreachable or slow); running on the runner image's own libraries and fonts."
      # visual-regression.spec.ts self-skips when CI is set (baselines are macOS-rendered).
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: tests/e2e/playwright-report
          retention-days: 7
